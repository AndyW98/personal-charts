# CI/CD for personal Helm charts.
#
#   lint     - yamllint + `ct lint` (helm lint, version-bump check on MRs)
#   validate - render every chart and validate manifests with kubeconform
#   package  - `helm package` every chart (artifacts kept for inspection)
#   publish  - push new chart versions to this project's GitLab Helm registry
#              (default branch only)
#
# Consume the published charts with:
#   helm repo add personal-charts \
#     https://<gitlab-host>/api/v4/projects/<project-id>/packages/helm/stable \
#     --username <user> --password <token-with-read_api>

stages:
  - lint
  - validate
  - package
  - publish

variables:
  HELM_IMAGE: alpine/helm:3.16.3
  CT_IMAGE: quay.io/helmpack/chart-testing:v3.11.0
  KUBECONFORM_VERSION: v0.6.7
  # Kubernetes version manifests are validated against. Match your cluster.
  KUBERNETES_VERSION: "1.31.0"
  HELM_CHANNEL: stable
  # Full history so ct can diff against the target branch.
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.has_charts: &has_charts |
  if ! ls charts/*/Chart.yaml >/dev/null 2>&1; then
    echo "No charts under charts/ yet - skipping."
    exit 0
  fi

lint:
  stage: lint
  image: $CT_IMAGE
  script:
    - *has_charts
    - yamllint -c .yamllint.yaml charts ct.yaml .gitlab-ci.yml
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        # Only lint changed charts and require a version bump on each.
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        ct lint --config ct.yaml --target-branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        ct lint --config ct.yaml --all --check-version-increment=false
      fi

validate:
  stage: validate
  image: $HELM_IMAGE
  before_script:
    - apk add --no-cache curl tar
    - curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
  script:
    - *has_charts
    - |
      set -e
      for dir in charts/*/; do
        name="$(basename "$dir")"
        echo "==> $name"
        helm dependency build "$dir" >/dev/null
        # Render with default values plus any ci/*-values.yaml test files.
        value_files="$(ls "$dir"ci/*-values.yaml 2>/dev/null || true)"
        for vf in "" $value_files; do
          args=""
          [ -n "$vf" ] && args="-f $vf" && echo "    values: $vf"
          helm template "$name" "$dir" $args --kube-version "$KUBERNETES_VERSION" \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        done
      done

package:
  stage: package
  image: $HELM_IMAGE
  script:
    - *has_charts
    - mkdir -p .packaged
    - |
      for dir in charts/*/; do
        helm dependency build "$dir" >/dev/null
        helm package "$dir" --destination .packaged
      done
    - ls -l .packaged
  artifacts:
    paths:
      - .packaged/
    expire_in: 1 week

publish:
  stage: publish
  image: $HELM_IMAGE
  needs: [lint, validate, package]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash scripts/publish-charts.sh
  # To also publish OCI artifacts to the GitLab container registry, uncomment:
  # variables:
  #   OCI_REGISTRY: $CI_REGISTRY_IMAGE/charts
