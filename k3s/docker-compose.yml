# One k3s node per Docker host. The same file runs a control-plane node
# (K3S_ROLE=server) or a worker node (K3S_ROLE=agent); see README.md.
name: k3s

services:
  k3s:
    image: rancher/k3s:${K3S_VERSION:-v1.31.14-k3s1}
    container_name: k3s-${K3S_ROLE:-server}
    # "server" = control plane (also runs workloads), "agent" = worker only.
    command: ${K3S_ROLE:-server} ${K3S_EXTRA_ARGS:-}
    environment:
      # Shared cluster secret: must be identical on every node.
      K3S_TOKEN: ${K3S_TOKEN:?set K3S_TOKEN in .env (see .env.example)}
      # Agents (and additional servers): https://<server-ip>:6443.
      # Leave empty on the first server.
      K3S_URL: ${K3S_URL:-}
      # Defaults to the host's hostname when empty.
      K3S_NODE_NAME: ${K3S_NODE_NAME:-}
      # Server only (ignored by agents): write an admin kubeconfig to ./kubeconfig/.
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "${K3S_KUBECONFIG_MODE:-600}"
    # k3s runs its own container runtime and CNI, so it needs full access to
    # the host's network stack, cgroups and kernel modules.
    privileged: true
    network_mode: host
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      # Cluster state, images and local-path PVs.
      - k3s-data:/var/lib/rancher/k3s
      # Node identity (node password); needed to rejoin after a recreate.
      - k3s-etc:/etc/rancher
      - ./kubeconfig:/output
      - /lib/modules:/lib/modules:ro

volumes:
  k3s-data:
  k3s-etc:
