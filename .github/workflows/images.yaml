name: Build images

# Container images for charts in this repo: images/<chart>/Dockerfile is
# published as ghcr.io/<owner>/<chart>, tagged with the chart's appVersion.
# Images with an images/<chart>/manual-build file are skipped here and built
# by their own workflow.

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".github/workflows/images.yaml"
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/images.yaml"
  # Weekly rebuild to pick up base-image (Kali rolling) and security updates.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          images="$(find images -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' \
            | while read -r dir; do [ -e "$dir/manual-build" ] || basename "$dir"; done \
            | jq -Rnc '[inputs]')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images"

  build:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      # Full Kali tool sets are several GB; make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Resolve tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/${{ matrix.image }}"
          version="$(yq '.appVersion' "charts/${{ matrix.image }}/Chart.yaml")"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$repo:$version"
            echo "$repo:$version-$(date -u +%Y%m%d)"
            echo "$repo:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}
