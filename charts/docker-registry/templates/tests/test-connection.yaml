apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "docker-registry.fullname" . }}-test-connection"
  labels:
    {{- include "docker-registry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
        - -q
        - -O-
        - "http://{{ include "docker-registry.fullname" . }}:{{ .Values.service.port }}/v2/"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
