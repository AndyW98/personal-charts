{{- with .Values.clusterIssuer }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
  labels:
    {{- include "homelab-core.labels" $ | nindent 4 }}
spec:
  acme:
    server: {{ .server | quote }}
    email: {{ required "clusterIssuer.email is required" .email | quote }}
    privateKeySecretRef:
      name: {{ .privateKeySecretName }}
    solvers:
      {{- if .cloudflare.enabled }}
      - {{- with .cloudflare.dnsZones }}
        selector:
          dnsZones:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .cloudflare.apiTokenSecret.name }}
              key: {{ .cloudflare.apiTokenSecret.key }}
      {{- end }}
      {{- if .http01.enabled }}
      - http01:
          ingress:
            ingressClassName: {{ .http01.ingressClassName }}
      {{- end }}
{{- end }}
{{- end }}
