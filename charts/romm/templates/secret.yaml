{{- if not .Values.existingSecret }}
{{- $name := include "romm.appSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ROMM_AUTH_SECRET_KEY: {{ get $existing "ROMM_AUTH_SECRET_KEY" | default (randAlphaNum 64 | lower | b64enc) | quote }}
{{- end }}
{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "romm.mariadb.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ get $existing "mariadb-root-password" | default (randAlphaNum 32 | b64enc) | quote }}
  mariadb-password: {{ get $existing "mariadb-password" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
