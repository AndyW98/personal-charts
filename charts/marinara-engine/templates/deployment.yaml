apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marinara-engine.fullname" . }}
  labels:
    {{- include "marinara-engine.labels" . | nindent 4 }}
spec:
  # Single writer on the data volume: never run two pods at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "marinara-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env: {{ dict "config" .Values.config "secret" .Values.existingSecret "extraEnv" .Values.extraEnv "envFile" .Values.envFile "adminSecret" .Values.adminSecret "tls" .Values.tls | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "marinara-engine.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "marinara-engine.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or .Values.envFile.content .Values.envFile.existingSecret }}
      initContainers:
        # Install the configured .env where the image looks for it, replacing
        # any previous copy. The data volume keeps it writable for the app.
        - name: install-env
          image: {{ include "marinara-engine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - cp /marinara-env/.env /app/data/.env && chmod 600 /app/data/.env
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: env-file
              mountPath: /marinara-env
              readOnly: true
      {{- end }}
      containers:
        - name: marinara-engine
          image: {{ include "marinara-engine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "7860"
            - name: HOST
              value: "0.0.0.0"
            - name: DATA_DIR
              value: /app/data
            - name: FILE_STORAGE_DIR
              value: /app/data/storage
            # The .env (if any) only changes when the pod starts.
            - name: MARINARA_ENV_WATCH
              value: "0"
            {{- with .Values.config.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logFormat }}
            - name: LOG_FORMAT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: SSL_CERT
              value: /app/tls/tls.crt
            - name: SSL_KEY
              value: /app/tls/tls.key
            {{- end }}
            {{- if or .Values.adminSecret.generate .Values.adminSecret.existingSecret }}
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret.existingSecret | default (printf "%s-admin" (include "marinara-engine.fullname" .)) }}
                  key: {{ .Values.adminSecret.key }}
            {{- end }}
            {{- with .Values.config.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- with include "marinara-engine.trustedHosts" . }}
            - name: TRUSTED_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- with include "marinara-engine.csrfTrustedOrigins" . }}
            - name: CSRF_TRUSTED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.ipAllowlist }}
            - name: IP_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.config.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: {{ include "marinara-engine.portName" . }}
              containerPort: 7860
              protocol: TCP
          {{- range $probe := list "startupProbe" "livenessProbe" "readinessProbe" }}
          {{- with index $.Values $probe }}
          {{ $probe }}:
            {{- include "marinara-engine.probe" (dict "probe" . "root" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /app/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "marinara-engine.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if or .Values.envFile.content .Values.envFile.existingSecret }}
        - name: env-file
          secret:
            secretName: {{ .Values.envFile.existingSecret | default (printf "%s-env" (include "marinara-engine.fullname" .)) }}
            # Readable by the pod's fsGroup.
            defaultMode: 0440
            items:
              - key: {{ .Values.envFile.key }}
                path: .env
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "marinara-engine.tlsSecretName" . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
