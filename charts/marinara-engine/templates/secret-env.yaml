{{- include "marinara-engine.validate" . }}
{{- if .Values.envFile.content }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marinara-engine.fullname" . }}-env
  labels:
    {{- include "marinara-engine.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.envFile.key }}: {{ .Values.envFile.content | b64enc }}
{{- end }}
