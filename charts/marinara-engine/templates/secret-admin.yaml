{{- if .Values.adminSecret.generate }}
{{- $name := printf "%s-admin" (include "marinara-engine.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "marinara-engine.labels" . | nindent 4 }}
  annotations:
    # Losing this value only means re-entering it in clients, but keep it
    # stable across uninstall/reinstall like the data volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.adminSecret.key }}: {{ include "marinara-engine.secretValue" (list . $name .Values.adminSecret.key (randAlphaNum 64 | sha256sum)) }}
{{- end }}
